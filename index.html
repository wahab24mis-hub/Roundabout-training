<title>دوار المسارين</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Reem+Kufi:wght@600&family=Noto+Sans+Ethiopic:wght@400;600&family=Noto+Nastaliq+Urdu:wght@400;600&display=swap">
<style>
/* Layout: green-and-white training platform. Deep green hero with roundabout rings, simulator card plus rules column, quiz card below. */
:root{
  --bg:#F3F8F4; --card:#FFFFFF; --fg:#0E2A1E; --muted:#4D6A5B; --line:#D3E3D8; --soft:#E9F3EC;
  --hdr:#0A5C34; --road:#E4EBE6; --curb:#8CA096; --island:#CDE6D4;
  --l1:#1B9A57; --l2:#0A3A28; --on-l:#FFFFFF; --bad:#C23A32; --sig:#E59A1F; --pri:#0A5C34;
  --ok-bg:#D9F0E1; --ok-fg:#0F5132; --bad-bg:#FBE4E1; --bad-fg:#8F1F18; --info-bg:#E9F3EC; --info-fg:#0E2A1E;
  --sig-bg:#FCEFD6; --sig-fg:#5E3B05; --pc:#6B7771;
  --fb:"IBM Plex Sans Arabic","IBM Plex Sans",system-ui,sans-serif; --fd:"Reem Kufi","IBM Plex Sans Arabic",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0C1511; --card:#13201A; --fg:#E7F1EA; --muted:#9FB5A8; --line:#25382E; --soft:#1A2B22;
    --hdr:#0F3D27; --road:#1F2B25; --curb:#5C7266; --island:#1F3A2B;
    --l1:#4ADE80; --l2:#B7F0CF; --on-l:#0C1511; --bad:#F06A60; --sig:#F2B24A; --pri:#4ADE80;
    --ok-bg:#15392A; --ok-fg:#8FE0B0; --bad-bg:#3F1D1A; --bad-fg:#F4A8A0; --info-bg:#1A2B22; --info-fg:#E7F1EA;
    --sig-bg:#3B2C0F; --sig-fg:#F6CF86; --pc:#8D9993;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0C1511; --card:#13201A; --fg:#E7F1EA; --muted:#9FB5A8; --line:#25382E; --soft:#1A2B22;
  --hdr:#0F3D27; --road:#1F2B25; --curb:#5C7266; --island:#1F3A2B;
  --l1:#4ADE80; --l2:#B7F0CF; --on-l:#0C1511; --bad:#F06A60; --sig:#F2B24A; --pri:#4ADE80;
  --ok-bg:#15392A; --ok-fg:#8FE0B0; --bad-bg:#3F1D1A; --bad-fg:#F4A8A0; --info-bg:#1A2B22; --info-fg:#E7F1EA;
  --sig-bg:#3B2C0F; --sig-fg:#F6CF86; --pc:#8D9993;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);padding-block:16px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.app{max-width:1120px;margin:0 auto;font-family:var(--fb);font-size:16px;line-height:1.7}
.app[lang="ar"]{--fb:"IBM Plex Sans Arabic","IBM Plex Sans",system-ui,sans-serif;--fd:"Reem Kufi","IBM Plex Sans Arabic",system-ui,sans-serif}
.app[lang="en"]{--fb:"IBM Plex Sans",system-ui,sans-serif;--fd:"IBM Plex Sans",system-ui,sans-serif}
.app[lang="am"]{--fb:"Noto Sans Ethiopic","IBM Plex Sans",system-ui,sans-serif;--fd:"Noto Sans Ethiopic","IBM Plex Sans",system-ui,sans-serif}
.app[lang="ur"]{--fb:"Noto Nastaliq Urdu","IBM Plex Sans Arabic",system-ui,sans-serif;--fd:"Noto Nastaliq Urdu","IBM Plex Sans Arabic",system-ui,sans-serif;line-height:2.2}
button{font:inherit}
button:focus-visible{outline:3px solid var(--sig);outline-offset:2px}
.hero{position:relative;overflow:hidden;background:var(--hdr);color:#fff;border-radius:16px;padding:26px 24px;margin-bottom:22px;display:flex;flex-wrap:wrap;gap:18px 24px;align-items:flex-end;justify-content:space-between}
.rings{position:absolute;inset-block-start:-70px;inset-inline-end:-60px;width:300px;height:300px;opacity:.16;pointer-events:none}
.tt{position:relative;min-width:0;flex:1 1 360px}
.eyebrow{font-size:13px;font-weight:600;margin:0 0 2px;letter-spacing:.04em;color:#B8F0CF}
h1{font-family:var(--fd);font-size:34px;line-height:1.3;margin:0 0 6px;font-weight:600;text-wrap:balance;color:#fff}
.app[lang="ur"] h1{line-height:2}
.sub{margin:0;color:#E4F6EA;max-width:62ch}
.by{margin:12px 0 0;font-size:14px;font-weight:600;color:#fff;padding-inline-start:10px;border-inline-start:3px solid #7BE0A6}
.langs{position:relative;display:flex;gap:6px;flex-wrap:wrap}
.langs button{font-family:"IBM Plex Sans Arabic","IBM Plex Sans","Noto Sans Ethiopic","Noto Nastaliq Urdu",system-ui,sans-serif;font-size:15px;line-height:1.6;min-height:40px;padding:6px 14px;border:1px solid rgba(255,255,255,.5);border-radius:999px;background:transparent;color:#fff;cursor:pointer}
.langs button:hover{background:rgba(255,255,255,.12)}
.langs button[aria-pressed="true"]{background:#fff;color:#0A5C34;border-color:#fff;font-weight:600}
.grid{display:grid;gap:22px;grid-template-columns:minmax(0,1fr)}
@media (min-width:900px){.grid{grid-template-columns:minmax(0,1.2fr) minmax(0,.8fr);align-items:start}}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;min-width:0}
.lab{font-size:13px;font-weight:600;color:var(--muted);margin:0 0 6px}
.hint{font-size:13px;color:var(--muted);margin:-8px 0 14px}
.seg{display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));gap:8px;margin:0 0 14px}
.seg button{font-size:15px;line-height:1.5;min-height:44px;padding:8px 10px;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:10px;cursor:pointer}
.seg button:hover{border-color:var(--curb)}
.app[lang="ur"] .seg button{padding-block:4px;line-height:2}
#entries button[aria-pressed="true"]{background:var(--pri);border-color:var(--pri);color:#fff;font-weight:600}
:root[data-theme="dark"] #entries button[aria-pressed="true"]{color:#0C1511}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) #entries button[aria-pressed="true"]{color:#0C1511}}
#exits button[data-lane="1"][aria-pressed="true"]{border-color:var(--l1);box-shadow:inset 0 0 0 1px var(--l1);color:var(--l1);font-weight:600}
#exits button[data-lane="2"][aria-pressed="true"]{border-color:var(--l2);box-shadow:inset 0 0 0 1px var(--l2);color:var(--l2);font-weight:600}
#modes button[data-m="0"][aria-pressed="true"]{border-color:var(--ok-fg);color:var(--ok-fg);background:var(--ok-bg);font-weight:600}
#modes button[data-m]:not([data-m="0"])[aria-pressed="true"]{border-color:var(--bad-fg);color:var(--bad-fg);background:var(--bad-bg);font-weight:600}
.scene{display:block;width:100%;height:auto;border:1px solid var(--line);border-radius:12px;background:var(--card);cursor:pointer}
.sv{font-family:"IBM Plex Sans Arabic","IBM Plex Sans","Noto Sans Ethiopic",system-ui,sans-serif}
.road{fill:var(--road)}
.curb{stroke:var(--curb);stroke-width:1.5;fill:none}
.dash{stroke:var(--curb);stroke-width:1;stroke-dasharray:6 6;fill:none;opacity:.8}
.band1{fill:none;stroke:var(--l1);stroke-opacity:.25;stroke-width:22}
.band2{fill:none;stroke:var(--l2);stroke-opacity:.22;stroke-width:22}
.island{fill:var(--island);stroke:var(--curb);stroke-width:1}
.tag{fill:var(--card);stroke:var(--curb);stroke-width:1}
.tagt{fill:var(--fg);font-size:12px;font-weight:600;text-anchor:middle;dominant-baseline:central}
.lt{fill:var(--on-l);font-size:11px;font-weight:600;text-anchor:middle;dominant-baseline:central}
.l1f{fill:var(--l1)}.l2f{fill:var(--l2)}
#trail{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:2 7}
.dashbar{display:flex;justify-content:space-between;gap:10px;margin:10px 0}
.lamp{display:flex;align-items:center;gap:8px;padding:4px 12px;border:1px solid var(--line);border-radius:10px;font-size:14px;line-height:1.6;color:var(--muted);background:var(--soft)}
.lamp svg{width:22px;height:22px;fill:var(--curb);flex:none}
.lamp.on{background:var(--sig-bg);border-color:var(--sig);color:var(--sig-fg)}
.lamp.on svg{fill:var(--sig)}
.cap{border-radius:12px;padding:12px 14px;min-height:92px;background:var(--info-bg);color:var(--info-fg)}
.cap[data-k="g"]{background:var(--ok-bg);color:var(--ok-fg)}
.cap[data-k="r"]{background:var(--bad-bg);color:var(--bad-fg)}
.cap p{margin:0}
.cap .ph{font-size:13px;font-weight:600}
.cap .tx{font-size:16px;line-height:1.7}
.flow{list-style:none;margin:12px 0 0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:8px}
.flow li{display:flex;flex-direction:column;align-items:flex-start;gap:6px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;font-size:13px;line-height:1.5;background:var(--card);color:var(--muted);min-width:0}
.flow .n{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;line-height:1;font-weight:600;background:var(--soft);color:var(--muted)}
.flow li[data-s="cur"]{border-color:var(--pri);color:var(--fg)}
.flow li[data-s="cur"] .n{background:var(--pri);color:#fff}
.flow li[data-s="done"]{color:var(--fg)}
.flow li[data-s="done"] .n{background:var(--ok-fg);color:var(--ok-bg)}
.flow li[data-s="bad"]{border-color:var(--bad);background:var(--bad-bg);color:var(--bad-fg)}
.flow li[data-s="bad"] .n{background:var(--bad-fg);color:var(--bad-bg)}
.ctl{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 0}
.ctl button{font-size:14px;line-height:1.6;min-height:40px;padding:6px 16px;border:1px solid var(--line);border-radius:999px;background:var(--card);color:var(--fg);cursor:pointer}
.ctl button:hover{border-color:var(--curb)}
.ctl button[aria-pressed="true"]{background:var(--pri);color:#fff;border-color:var(--pri)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;line-height:1.6;color:var(--muted);margin:14px 0 0}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin-inline-end:6px}
.side{display:grid;gap:22px;min-width:0}
h2{font-family:var(--fd);font-size:20px;line-height:1.4;margin:0 0 12px;font-weight:600;text-wrap:balance}
.app[lang="ur"] h2{line-height:2}
ol.rules{margin:0;padding:0;list-style:none;display:grid;gap:12px}
ol.rules li{display:grid;grid-template-columns:28px minmax(0,1fr);gap:12px;align-items:start}
ol.rules .n{width:28px;height:28px;border-radius:50%;background:var(--pri);color:#fff;font-weight:600;font-size:14px;line-height:1;display:grid;place-items:center;margin-top:3px}
:root[data-theme="dark"] ol.rules .n{color:#0C1511}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) ol.rules .n{color:#0C1511}}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 0}
.chip{font-size:14px;line-height:1.6;padding:2px 12px;border-radius:999px;border:1px solid}
.chip.c1{border-color:var(--l1);color:var(--l1)}
.chip.c2{border-color:var(--l2);color:var(--l2)}
ul.errs{margin:0;padding:0;list-style:none;display:grid;gap:8px}
ul.errs li{padding:8px 12px;border-radius:10px;background:var(--bad-bg);color:var(--bad-fg);font-size:15px;line-height:1.7}
.quiz{margin-top:22px}
.qhead{display:flex;flex-wrap:wrap;gap:4px 16px;align-items:baseline;justify-content:space-between;margin-bottom:12px}
.qhead h2{margin:0}
.qsub{margin:0;color:var(--muted);font-size:15px}
.bar{height:6px;border-radius:3px;background:var(--soft);overflow:hidden;margin:0 0 16px}
.bar i{display:block;height:100%;background:var(--pri);width:0}
.qcount{font-size:13px;font-weight:600;color:var(--muted);margin:0 0 4px}
.qtext{font-family:var(--fd);font-size:19px;line-height:1.6;margin:0 0 12px;font-weight:600}
.app[lang="ur"] .qtext{line-height:2.1}
.opts{display:grid;gap:8px;max-width:720px}
.opt{display:block;width:100%;text-align:start;font-size:16px;line-height:1.6;padding:10px 14px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--fg);cursor:pointer}
.app[lang="ur"] .opt{line-height:2}
.opt:hover{border-color:var(--curb)}
.opt[data-s="ok"]{background:var(--ok-bg);border-color:var(--ok-fg);color:var(--ok-fg);font-weight:600}
.opt[data-s="no"]{background:var(--bad-bg);border-color:var(--bad-fg);color:var(--bad-fg)}
.opt[data-s="lock"]{cursor:default;opacity:.75}
.fb{margin:12px 0 0;max-width:720px;padding:10px 14px;border-radius:10px;background:var(--info-bg);color:var(--info-fg)}
.fb b{display:block;font-size:13px}
.qbtn{margin-top:14px;font-size:15px;line-height:1.6;min-height:42px;padding:6px 20px;border:1px solid var(--pri);border-radius:999px;background:var(--pri);color:#fff;cursor:pointer}
:root[data-theme="dark"] .qbtn{color:#0C1511}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .qbtn{color:#0C1511}}
.score{font-family:var(--fd);font-size:26px;line-height:1.5;margin:6px 0 4px;font-weight:600;color:var(--pri)}
@media (prefers-reduced-motion:no-preference){.cap{transition:background .2s}.bar i{transition:width .3s}}
</style>

<div class="app" id="app" lang="ar" dir="rtl">
  <header class="hero">
    <svg class="rings" viewBox="0 0 300 300" fill="none" stroke="#fff" aria-hidden="true">
      <circle cx="150" cy="150" r="140" stroke-width="2"/>
      <circle cx="150" cy="150" r="108" stroke-width="2" stroke-dasharray="10 10"/>
      <circle cx="150" cy="150" r="76" stroke-width="2"/>
      <circle cx="150" cy="150" r="44" stroke-width="2" stroke-dasharray="10 10"/>
    </svg>
    <div class="tt">
      <p class="eyebrow" data-i="eyebrow"></p>
      <h1 data-i="title"></h1>
      <p class="sub" data-i="sub"></p>
      <p class="by" data-i="by"></p>
    </div>
    <div class="langs" id="langs" role="group" aria-label="Language">
      <button data-lang="ar">العربية</button>
      <button data-lang="en">English</button>
      <button data-lang="am">አማርኛ</button>
      <button data-lang="ur">اردو</button>
    </div>
  </header>

  <div class="grid">
    <main class="card" id="stage">
      <p class="lab" data-i="labEntry"></p>
      <div class="seg" id="entries">
        <button data-n="0"></button><button data-n="1"></button><button data-n="2"></button><button data-n="3"></button>
      </div>
      <p class="lab" data-i="labExit"></p>
      <div class="seg" id="exits">
        <button data-e="1" data-lane="1"></button>
        <button data-e="2" data-lane="1"></button>
        <button data-e="3" data-lane="2"></button>
        <button data-e="4" data-lane="2"></button>
      </div>
      <p class="hint" data-i="hintExit"></p>
      <p class="lab" data-i="labMode"></p>
      <div class="seg" id="modes">
        <button data-m="0"></button>
        <button data-m="1"></button>
        <button data-m="2"></button>
      </div>

      <svg id="scene" class="scene sv" viewBox="0 0 380 380" role="img" aria-label="Roundabout">
        <defs>
          <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="var(--curb)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
        </defs>
        <rect class="road" x="158" y="190" width="64" height="190"/>
        <rect class="road" x="158" y="0" width="64" height="190"/>
        <rect class="road" x="0" y="158" width="190" height="64"/>
        <rect class="road" x="190" y="158" width="190" height="64"/>
        <circle class="road" cx="190" cy="190" r="90"/>
        <circle class="band1" cx="190" cy="190" r="79"/>
        <circle class="band2" cx="190" cy="190" r="57"/>
        <circle cx="190" cy="190" r="68" fill="none" stroke="var(--curb)" stroke-width="1" stroke-dasharray="6 6"/>
        <circle class="island" cx="190" cy="190" r="46"/>
        <path d="M218.2 179.7A30 30 0 0 0 161.8 179.7" fill="none" stroke="var(--curb)" stroke-width="1.5" marker-end="url(#ah)"/>
        <path d="M161.8 200.3A30 30 0 0 0 218.2 200.3" fill="none" stroke="var(--curb)" stroke-width="1.5" marker-end="url(#ah)"/>
        <path class="curb" d="M190 280V380M190 100V0M100 190H0M280 190H380"/>
        <path class="dash" d="M174 278.6V380M206 278.6V380M174 101.4V0M206 101.4V0M101.4 174H0M101.4 206H0M278.6 174H380M278.6 206H380"/>
        <path class="curb" d="M158 274.1V380M222 274.1V380M158 105.9V0M222 105.9V0M105.9 158H0M105.9 222H0M274.1 158H380M274.1 222H380"/>
        <path class="curb" d="M222 274.1A90 90 0 0 0 274.1 222M274.1 158A90 90 0 0 0 222 105.9M158 105.9A90 90 0 0 0 105.9 158M105.9 222A90 90 0 0 0 158 274.1"/>
        <g id="labs"></g>
        <g id="rot" transform="rotate(0 190 190)">
          <line x1="190" y1="292" x2="222" y2="292" stroke="var(--fg)" stroke-width="3"/>
          <g id="signG" transform="translate(252,300)" opacity="0.55">
            <polygon points="15.7,6.5 6.5,15.7 -6.5,15.7 -15.7,6.5 -15.7,-6.5 -6.5,-15.7 6.5,-15.7 15.7,-6.5" fill="#C23A32" stroke="#fff" stroke-width="1.5"/>
            <text id="stopTxt" x="0" y="0" fill="#fff" font-size="10" font-weight="600" text-anchor="middle" dominant-baseline="central">STOP</text>
          </g>
          <path id="trail" d=""/>
          <g id="pc" transform="translate(190,600)" opacity="0">
            <rect x="-10" y="-5.5" width="20" height="11" rx="3" fill="var(--pc)"/>
            <rect x="1" y="-4" width="6" height="8" rx="1.5" fill="var(--card)" opacity="0.85"/>
          </g>
          <g id="mark" style="display:none"><circle id="markc" cx="0" cy="0" r="14" fill="none" stroke="var(--bad)" stroke-width="2.5"/></g>
          <g id="car" transform="translate(190,600)">
            <rect id="carb" x="-10" y="-5.5" width="20" height="11" rx="3"/>
            <rect x="1" y="-4" width="6" height="8" rx="1.5" fill="var(--card)" opacity="0.85"/>
            <g id="sigL" style="display:none"><circle cx="9" cy="-6.5" r="2.6" fill="var(--sig)"/><circle cx="-9" cy="-6.5" r="2.6" fill="var(--sig)"/></g>
            <g id="sigR" style="display:none"><circle cx="9" cy="6.5" r="2.6" fill="var(--sig)"/><circle cx="-9" cy="6.5" r="2.6" fill="var(--sig)"/></g>
          </g>
        </g>
      </svg>

      <div class="dashbar" dir="ltr">
        <div class="lamp" id="lampL">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 5L5 12l9 7v-4h5V9h-5z"/></svg>
          <span data-i="sigL"></span>
        </div>
        <div class="lamp" id="lampR">
          <span data-i="sigR"></span>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 5l9 7-9 7v-4H5V9h5z"/></svg>
        </div>
      </div>

      <div class="cap" id="cap" data-k="a" aria-live="polite">
        <p class="ph" id="ph"></p>
        <p class="tx" id="tx"></p>
      </div>

      <ol class="flow" id="flow">
        <li><span class="n"></span><span class="l"></span></li>
        <li><span class="n"></span><span class="l"></span></li>
        <li><span class="n"></span><span class="l"></span></li>
        <li><span class="n"></span><span class="l"></span></li>
        <li><span class="n"></span><span class="l"></span></li>
      </ol>

      <div class="ctl">
        <button id="bReplay"></button>
        <button id="bPause"></button>
        <button id="bSlow" aria-pressed="false"></button>
      </div>

      <div class="legend">
        <span><i class="l1f"></i><span data-i="lg1"></span></span>
        <span><i class="l2f"></i><span data-i="lg2"></span></span>
        <span><i style="background:var(--pc)"></i><span data-i="lg3"></span></span>
      </div>
    </main>

    <aside class="side">
      <section class="card">
        <h2 data-i="rulesT"></h2>
        <ol class="rules" id="rules"></ol>
        <div class="chips">
          <span class="chip c1" data-i="chip1"></span>
          <span class="chip c2" data-i="chip2"></span>
        </div>
      </section>
      <section class="card">
        <h2 data-i="errsT"></h2>
        <ul class="errs" id="errs"></ul>
      </section>
    </aside>
  </div>

else if(l<LE+30){key='enter';idx=2;}
else if(l<LR-45){key=(mode===1)?'ringBad':'ring';kind=(mode===1)?'r':'a';idx=3;if(mode===1)bad=3;}
else if(l<LR+10){key=(mode===1)?'ringBad':'signal';kind=(mode===1)?'r':'a';idx=4;if(mode===1)bad=3;}
else{key=(mode===1)?'ringBad':'exit';kind=(mode===1)?'r':'a';idx=4;if(mode===1)bad=3;}
}
setCap(kind,key);
for(var i=0;i<5;i++){
var st=i<idx?'done':(i===idx?'cur':'todo');
if(i===bad)st='bad';
if(flowLis[i].getAttribute('data-s')!==st)flowLis[i].setAttribute('data-s',st);
}
if(mode===1&&idx>=3)flowLis[3].setAttribute('data-s','bad');
show(mark,(mode===1&&l>LE+(LR-LE)*0.3)||(mode===2&&fin));
signG.setAttribute('opacity',(key==='stop'||key==='collide')?'1':'0.55');
}

function tick(now){
if(!last)last=now;
var dt=Math.min(0.05,(now-last)/1000);last=now;
if(!S.paused&&!fin)tv+=dt*(S.slow?0.5:1);
render(tv);
raf=requestAnimationFrame(tick);
}
function restart(){
tv=0;fin=false;lastCap='';S.paused=false;
$('bPause').textContent=T().ctl.pause;
build();
if(reduce){tv=100;render(tv);}
else render(0);
}

function renderQuiz(){
var t=T(),U=t.qUI,Q=t.q,n=Q.length;
$('qbar').style.width=(100*(QZ.done?n:QZ.i+(QZ.sel>=0?1:0))/n)+'%';
show($('qbody'),!QZ.done);show($('qres'),QZ.done);
$('qretry').textContent=U.retry;
if(QZ.done){$('qscore').textContent=fmt(U.score,{s:num(QZ.score),n:num(n)});return;}
var q=Q[QZ.i];
$('qcount').textContent=fmt(U.count,{i:num(QZ.i+1),n:num(n)});
$('qtext').textContent=q.q;
var box=$('qopts');box.textContent='';
q.o.forEach(function(txt,k){
var b=document.createElement('button');b.className='opt';b.textContent=txt;b.setAttribute('data-k',k);
if(QZ.sel>=0){
if(k===COR[QZ.i])b.setAttribute('data-s','ok');
else if(k===QZ.sel)b.setAttribute('data-s','no');
else b.setAttribute('data-s','lock');
}
box.appendChild(b);
});
var answered=QZ.sel>=0;
show($('qfb'),answered);show($('qnext'),answered);
if(answered){
$('qfbh').textContent=QZ.sel===COR[QZ.i]?U.ok:U.no;
$('qfbt').textContent=q.e;
$('qnext').textContent=QZ.i<n-1?U.next:U.result;
}
}

function applyLang(){
var t=T(),app=$('app');
app.setAttribute('lang',S.lang);app.setAttribute('dir',t.dir);
Array.prototype.forEach.call(app.querySelectorAll('[data-i]'),function(el){el.textContent=t[el.getAttribute('data-i')];});
Array.prototype.forEach.call($('entries').children,function(b){b.textContent=t.entries[+b.dataset.n];});
Array.prototype.forEach.call($('exits').children,function(b){b.textContent=fmt(t.exitBtn,{E:num(+b.dataset.e),L:num(+b.dataset.lane)});});
Array.prototype.forEach.call($('modes').children,function(b){b.textContent=t.modes[+b.dataset.m];});
Array.prototype.forEach.call(flowLis,function(li,i){li.children[0].textContent=num(i+1);li.children[1].textContent=t.steps[i];});
var rl=$('rules');rl.textContent='';
t.rules.forEach(function(s,i){var li=document.createElement('li'),n=document.createElement('span'),x=document.createElement('span');n.className='n';n.textContent=num(i+1);x.textContent=s;li.appendChild(n);li.appendChild(x);rl.appendChild(li);});
var er=$('errs');er.textContent='';
t.errs.forEach(function(s){var li=document.createElement('li');li.textContent=s;er.appendChild(li);});
$('stopTxt').textContent=t.stop;
$('bReplay').textContent=t.ctl.replay;
$('bPause').textContent=S.paused?t.ctl.play:t.ctl.pause;
$('bSlow').textContent=t.ctl.slow;
$('scene').setAttribute('aria-label',t.title);
Array.prototype.forEach.call($('langs').children,function(b){b.setAttribute('aria-pressed',String(b.dataset.lang===S.lang));});
placeLabels();
renderQuiz();
lastCap='';
}
function paint(){
Array.prototype.forEach.call($('entries').children,function(b){b.setAttribute('aria-pressed',String(+b.dataset.n===S.entry));});
Array.prototype.forEach.call($('exits').children,function(b){b.setAttribute('aria-pressed',String(+b.dataset.e===S.exit));});
Array.prototype.forEach.call($('modes').children,function(b){b.setAttribute('aria-pressed',String(+b.dataset.m===S.mode));});
}
function setLang(l,fromHash){
if(!I18N[l])return;
S.lang=l;
try{localStorage.setItem('rb-lang',l);}catch(e){}
if(!fromHash){try{if(location.hash.slice(1)!==l)location.hash=l;}catch(e){}}
applyLang();
render(tv);
}

$('langs').addEventListener('click',function(ev){var b=ev.target.closest('button');if(b)setLang(b.dataset.lang,false);});
$('entries').addEventListener('click',function(ev){var b=ev.target.closest('button');if(!b)return;S.entry=+b.dataset.n;paint();placeLabels();restart();});
$('exits').addEventListener('click',function(ev){var b=ev.target.closest('button');if(!b)return;S.exit=+b.dataset.e;paint();restart();});
$('modes').addEventListener('click',function(ev){var b=ev.target.closest('button');if(!b)return;S.mode=+b.dataset.m;paint();restart();});
$('scene').addEventListener('click',restart);
$('bReplay').addEventListener('click',restart);
$('bPause').addEventListener('click',function(){S.paused=!S.paused;this.textContent=S.paused?T().ctl.play:T().ctl.pause;});
$('bSlow').addEventListener('click',function(){S.slow=!S.slow;this.setAttribute('aria-pressed',String(S.slow));});
$('qopts').addEventListener('click',function(ev){
var b=ev.target.closest('button');if(!b||QZ.sel>=0)return;
QZ.sel=+b.getAttribute('data-k');
if(QZ.sel===COR[QZ.i])QZ.score++;
renderQuiz();
});
$('qnext').addEventListener('click',function(){
if(QZ.i<T().q.length-1){QZ.i++;QZ.sel=-1;}else{QZ.done=true;}
renderQuiz();
});
$('qretry').addEventListener('click',function(){QZ.i=0;QZ.score=0;QZ.sel=-1;QZ.done=false;renderQuiz();});
window.addEventListener('hashchange',function(){var h=location.hash.slice(1);if(I18N[h]&&h!==S.lang)setLang(h,true);});

var init='ar';
try{var sv=localStorage.getItem('rb-lang');if(I18N[sv])init=sv;}catch(e){}
var h0=(location.hash||'').slice(1);
if(I18N[h0])init=h0;
S.lang=init;
applyLang();paint();build();
if(reduce){tv=100;render(tv);}
else{render(0);raf=requestAnimationFrame(tick);}
})();
</script>
