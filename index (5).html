<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>index.html</title>
<meta name="description" content="منصة تدريب السائقين: دوار المسارين والوقوف الخلفي بزاوية ٩٠ درجة.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Reem+Kufi:wght@600&family=Noto+Sans+Ethiopic:wght@400;600&family=Noto+Nastaliq+Urdu:wght@400;600&display=swap">
<style>
:root{
  --bg:#F3F8F4; --card:#FFFFFF; --fg:#0E2A1E; --muted:#4D6A5B; --line:#D3E3D8; --soft:#E9F3EC;
  --hdr:#0A5C34; --road:#E4EBE6; --curb:#8CA096; --island:#CDE6D4;
  --l1:#1B9A57; --l2:#0A3A28; --on-l:#FFFFFF; --bad:#C23A32; --sig:#E59A1F; --pri:#0A5C34; --on-pri:#FFFFFF;
  --ok-bg:#D9F0E1; --ok-fg:#0F5132; --bad-bg:#FBE4E1; --bad-fg:#8F1F18; --info-bg:#E9F3EC; --info-fg:#0E2A1E;
  --sig-bg:#FCEFD6; --sig-fg:#5E3B05; --pc:#6B7771;
  --asph:#4A5650; --asph2:#56625C; --paint:#F4F7F5; --green-strip:#9CC7A9;
  --car:#1FA35C; --car-glass:#CFEFDC; --trail:#9BF0BE; --okline:#5CE59A;
  --gold:#B18E31; --gold-soft:rgba(177,142,49,.35);
  --fb:"IBM Plex Sans Arabic","IBM Plex Sans",system-ui,sans-serif; --fd:"Reem Kufi","IBM Plex Sans Arabic",system-ui,sans-serif;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
  --bg:#0C1511; --card:#13201A; --fg:#E7F1EA; --muted:#9FB5A8; --line:#25382E; --soft:#1A2B22;
  --hdr:#0F3D27; --road:#1F2B25; --curb:#5C7266; --island:#1F3A2B;
  --l1:#4ADE80; --l2:#B7F0CF; --on-l:#0C1511; --bad:#F06A60; --sig:#F2B24A; --pri:#4ADE80; --on-pri:#0C1511;
  --ok-bg:#15392A; --ok-fg:#8FE0B0; --bad-bg:#3F1D1A; --bad-fg:#F4A8A0; --info-bg:#1A2B22; --info-fg:#E7F1EA;
  --sig-bg:#3B2C0F; --sig-fg:#F6CF86; --pc:#8D9993;
  --asph:#222C27; --asph2:#2A3530; --paint:#E3EBE6; --green-strip:#1F3A2B;
  --car:#34C474; --car-glass:#0F2A1C; --trail:#9BF0BE; --okline:#5CE59A;
  --gold:#C9A443; --gold-soft:rgba(201,164,67,.35);
  color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0C1511; --card:#13201A; --fg:#E7F1EA; --muted:#9FB5A8; --line:#25382E; --soft:#1A2B22;
  --hdr:#0F3D27; --road:#1F2B25; --curb:#5C7266; --island:#1F3A2B;
  --l1:#4ADE80; --l2:#B7F0CF; --on-l:#0C1511; --bad:#F06A60; --sig:#F2B24A; --pri:#4ADE80; --on-pri:#0C1511;
  --ok-bg:#15392A; --ok-fg:#8FE0B0; --bad-bg:#3F1D1A; --bad-fg:#F4A8A0; --info-bg:#1A2B22; --info-fg:#E7F1EA;
  --sig-bg:#3B2C0F; --sig-fg:#F6CF86; --pc:#8D9993;
  --asph:#222C27; --asph2:#2A3530; --paint:#E3EBE6; --green-strip:#1F3A2B;
  --car:#34C474; --car-glass:#0F2A1C; --trail:#9BF0BE; --okline:#5CE59A;
  --gold:#C9A443; --gold-soft:rgba(201,164,67,.35);
  color-scheme:dark;
}

html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);padding-block:12px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
/* Brand bar */
.brand{display:flex;align-items:center;gap:18px;padding:6px 4px 16px;margin-bottom:18px;border-bottom:1px solid var(--line);position:relative}
.brand::after{content:"";position:absolute;inset-block-end:-1px;inset-inline-start:0;width:120px;height:2px;background:var(--gold)}
.brand img{display:block;height:52px;width:auto;flex:none}
.brand .sep{width:1px;align-self:stretch;margin-block:6px;background:var(--gold-soft)}
.brand .bt{min-width:0}
.brand .bn{margin:0;font-family:var(--fd);font-size:19px;line-height:1.4;font-weight:600;color:var(--fg)}
.brand .bs{margin:0;font-size:13px;line-height:1.5;color:var(--muted)}
.app[lang="ur"] .brand .bn,.app[lang="ur"] .brand .bs{line-height:2}
@media (max-width:560px){.brand{gap:12px}.brand img{height:38px}.brand .bn{font-size:16px}.brand .bs{display:none}}
/* Hero decoration per module */
.hero .deco{position:absolute;pointer-events:none;opacity:.16}
.hero .rings{inset-block-start:-70px;inset-inline-end:-60px;width:300px;height:300px}
.hero .bays{inset-block-start:-10px;inset-inline-end:-20px;width:320px;height:200px}
.app[data-mod="rb"] .hero .bays,.app[data-mod="pk"] .hero .rings{display:none}
/* Module switcher */
.mods{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin:0 0 22px}
.mtab{display:flex;align-items:center;gap:14px;text-align:start;padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--fg);cursor:pointer;min-width:0}
.mtab:hover{border-color:var(--curb)}
.mtab .ic{width:46px;height:46px;flex:none;border-radius:12px;display:grid;place-items:center;background:var(--soft);color:var(--pri)}
.mtab .ic svg{width:26px;height:26px}
.mtab .mt{display:block;font-family:var(--fd);font-size:17px;line-height:1.4;font-weight:600}
.mtab .md{display:block;font-size:13px;line-height:1.5;color:var(--muted)}
.app[lang="ur"] .mtab .mt,.app[lang="ur"] .mtab .md{line-height:2}
.mtab[aria-selected="true"]{border-color:var(--pri);box-shadow:inset 0 0 0 1px var(--pri)}
.mtab[aria-selected="true"] .ic{background:var(--pri);color:var(--on-pri)}
.mod[hidden]{display:none}
.app{max-width:1120px;margin:0 auto;font-family:var(--fb);font-size:16px;line-height:1.7}
.app[lang="ar"]{--fb:"IBM Plex Sans Arabic","IBM Plex Sans",system-ui,sans-serif;--fd:"Reem Kufi","IBM Plex Sans Arabic",system-ui,sans-serif}
.app[lang="en"]{--fb:"IBM Plex Sans",system-ui,sans-serif;--fd:"IBM Plex Sans",system-ui,sans-serif}
.app[lang="am"]{--fb:"Noto Sans Ethiopic","IBM Plex Sans",system-ui,sans-serif;--fd:"Noto Sans Ethiopic","IBM Plex Sans",system-ui,sans-serif}
.app[lang="ur"]{--fb:"Noto Nastaliq Urdu","IBM Plex Sans Arabic",system-ui,sans-serif;--fd:"Noto Nastaliq Urdu","IBM Plex Sans Arabic",system-ui,sans-serif;line-height:2.2}
button{font:inherit}
button:focus-visible{outline:3px solid var(--sig);outline-offset:2px}
.hero{position:relative;overflow:hidden;background:var(--hdr);color:#fff;border-radius:16px;padding:26px 24px;margin-bottom:22px;display:flex;flex-wrap:wrap;gap:18px 24px;align-items:flex-end;justify-content:space-between}
.rings{position:absolute;inset-block-start:-70px;inset-inline-end:-60px;width:300px;height:300px;opacity:.16;pointer-events:none}
.tt{position:relative;min-width:0;flex:1 1 360px}
.eyebrow{font-size:13px;font-weight:600;margin:0 0 2px;letter-spacing:.04em;color:#B8F0CF}
h1{font-family:var(--fd);font-size:34px;line-height:1.3;margin:0 0 6px;font-weight:600;text-wrap:balance;color:#fff}
.app[lang="ur"] h1{line-height:2}
.sub{margin:0;color:#E4F6EA;max-width:62ch}
.by{margin:12px 0 0;font-size:14px;font-weight:600;color:#fff;padding-inline-start:10px;border-inline-start:3px solid #7BE0A6}
.langs{position:relative;display:flex;gap:6px;flex-wrap:wrap}
.langs button{font-family:"IBM Plex Sans Arabic","IBM Plex Sans","Noto Sans Ethiopic","Noto Nastaliq Urdu",system-ui,sans-serif;font-size:15px;line-height:1.6;min-height:40px;padding:6px 14px;border:1px solid rgba(255,255,255,.5);border-radius:999px;background:transparent;color:#fff;cursor:pointer}
.langs button:hover{background:rgba(255,255,255,.12)}
.langs button[aria-pressed="true"]{background:#fff;color:#0A5C34;border-color:#fff;font-weight:600}
.grid{display:grid;gap:22px;grid-template-columns:minmax(0,1fr)}
@media (min-width:900px){.grid{grid-template-columns:minmax(0,1.2fr) minmax(0,.8fr);align-items:start}}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;min-width:0}
.lab{font-size:13px;font-weight:600;color:var(--muted);margin:0 0 6px}
.hint{font-size:13px;color:var(--muted);margin:-8px 0 14px}
.seg{display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));gap:8px;margin:0 0 14px}
.seg button{font-size:15px;line-height:1.5;min-height:44px;padding:8px 10px;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:10px;cursor:pointer}
.seg button:hover{border-color:var(--curb)}
.app[lang="ur"] .seg button{padding-block:4px;line-height:2}
#entries button[aria-pressed="true"],#pk-sides button[aria-pressed="true"],#pk-dirs button[aria-pressed="true"]{background:var(--pri);border-color:var(--pri);color:#fff;font-weight:600}
:root[data-theme="dark"] #entries button[aria-pressed="true"],:root[data-theme="dark"] #pk-sides button[aria-pressed="true"],#pk-dirs button[aria-pressed="true"]{color:#0C1511}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) #entries button[aria-pressed="true"],:root:not([data-theme="light"]) #pk-sides button[aria-pressed="true"],#pk-dirs button[aria-pressed="true"]{color:#0C1511}}
#exits button[data-lane="1"][aria-pressed="true"]{border-color:var(--l1);box-shadow:inset 0 0 0 1px var(--l1);color:var(--l1);font-weight:600}
#exits button[data-lane="2"][aria-pressed="true"]{border-color:var(--l2);box-shadow:inset 0 0 0 1px var(--l2);color:var(--l2);font-weight:600}
#modes button[data-m="0"][aria-pressed="true"],#pk-modes button[data-m="0"][aria-pressed="true"]{border-color:var(--ok-fg);color:var(--ok-fg);background:var(--ok-bg);font-weight:600}
#modes button[data-m]:not([data-m="0"])[aria-pressed="true"],#pk-modes button[data-m]:not([data-m="0"])[aria-pressed="true"]{border-color:var(--bad-fg);color:var(--bad-fg);background:var(--bad-bg);font-weight:600}
.scene{display:block;width:100%;height:auto;border:1px solid var(--line);border-radius:12px;background:var(--card);cursor:pointer}
.sv{font-family:"IBM Plex Sans Arabic","IBM Plex Sans","Noto Sans Ethiopic",system-ui,sans-serif}
.road{fill:var(--road)}
.curb{stroke:var(--curb);stroke-width:1.5;fill:none}
.dash{stroke:var(--curb);stroke-width:1;stroke-dasharray:6 6;fill:none;opacity:.8}
.band1{fill:none;stroke:var(--l1);stroke-opacity:.25;stroke-width:22}
.band2{fill:none;stroke:var(--l2);stroke-opacity:.22;stroke-width:22}
.island{fill:var(--island);stroke:var(--curb);stroke-width:1}
.tag{fill:var(--card);stroke:var(--curb);stroke-width:1}
.tagt{fill:var(--fg);font-size:12px;font-weight:600;text-anchor:middle;dominant-baseline:central}
.lt{fill:var(--on-l);font-size:11px;font-weight:600;text-anchor:middle;dominant-baseline:central}
.l1f{fill:var(--l1)}.l2f{fill:var(--l2)}
#trail{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:2 7}
.dashbar{display:flex;justify-content:space-between;gap:10px;margin:10px 0}
.lamp{display:flex;align-items:center;gap:8px;padding:4px 12px;border:1px solid var(--line);border-radius:10px;font-size:14px;line-height:1.6;color:var(--muted);background:var(--soft)}
.lamp svg{width:22px;height:22px;fill:var(--curb);flex:none}
.lamp.on{background:var(--sig-bg);border-color:var(--sig);color:var(--sig-fg)}
.lamp.on svg{fill:var(--sig)}
.cap{border-radius:12px;padding:12px 14px;min-height:92px;background:var(--info-bg);color:var(--info-fg)}
.cap[data-k="g"]{background:var(--ok-bg);color:var(--ok-fg)}
.cap[data-k="r"]{background:var(--bad-bg);color:var(--bad-fg)}
.cap p{margin:0}
.cap .ph{font-size:13px;font-weight:600}
.cap .tx{font-size:16px;line-height:1.7}
.flow{list-style:none;margin:12px 0 0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:8px}
.flow li{display:flex;flex-direction:column;align-items:flex-start;gap:6px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;font-size:13px;line-height:1.5;background:var(--card);color:var(--muted);min-width:0}
.flow .n{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;line-height:1;font-weight:600;background:var(--soft);color:var(--muted)}
.flow li[data-s="cur"]{border-color:var(--pri);color:var(--fg)}
.flow li[data-s="cur"] .n{background:var(--pri);color:#fff}
.flow li[data-s="done"]{color:var(--fg)}
.flow li[data-s="done"] .n{background:var(--ok-fg);color:var(--ok-bg)}
.flow li[data-s="bad"]{border-color:var(--bad);background:var(--bad-bg);color:var(--bad-fg)}
.flow li[data-s="bad"] .n{background:var(--bad-fg);color:var(--bad-bg)}
.ctl{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 0}
.ctl button{font-size:14px;line-height:1.6;min-height:40px;padding:6px 16px;border:1px solid var(--line);border-radius:999px;background:var(--card);color:var(--fg);cursor:pointer}
.ctl button:hover{border-color:var(--curb)}
.ctl button[aria-pressed="true"]{background:var(--pri);color:#fff;border-color:var(--pri)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;line-height:1.6;color:var(--muted);margin:14px 0 0}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin-inline-end:6px}
.side{display:grid;gap:22px;min-width:0}
h2{font-family:var(--fd);font-size:20px;line-height:1.4;margin:0 0 12px;font-weight:600;text-wrap:balance}
.app[lang="ur"] h2{line-height:2}
ol.rules{margin:0;padding:0;list-style:none;display:grid;gap:12px}
ol.rules li{display:grid;grid-template-columns:28px minmax(0,1fr);gap:12px;align-items:start}
ol.rules .n{width:28px;height:28px;border-radius:50%;background:var(--pri);color:#fff;font-weight:600;font-size:14px;line-height:1;display:grid;place-items:center;margin-top:3px}
:root[data-theme="dark"] ol.rules .n{color:#0C1511}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) ol.rules .n{color:#0C1511}}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 0}
.chip{font-size:14px;line-height:1.6;padding:2px 12px;border-radius:999px;border:1px solid}
.chip.c1{border-color:var(--l1);color:var(--l1)}
.chip.c2{border-color:var(--l2);color:var(--l2)}
ul.errs{margin:0;padding:0;list-style:none;display:grid;gap:8px}
ul.errs li{padding:8px 12px;border-radius:10px;background:var(--bad-bg);color:var(--bad-fg);font-size:15px;line-height:1.7}
.quiz{margin-top:22px}
.qhead{display:flex;flex-wrap:wrap;gap:4px 16px;align-items:baseline;justify-content:space-between;margin-bottom:12px}
.qhead h2{margin:0}
.qsub{margin:0;color:var(--muted);font-size:15px}
.bar{height:6px;border-radius:3px;background:var(--soft);overflow:hidden;margin:0 0 16px}
.bar i{display:block;height:100%;background:var(--pri);width:0}
.qcount{font-size:13px;font-weight:600;color:var(--muted);margin:0 0 4px}
.qtext{font-family:var(--fd);font-size:19px;line-height:1.6;margin:0 0 12px;font-weight:600}
.app[lang="ur"] .qtext{line-height:2.1}
.opts{display:grid;gap:8px;max-width:720px}
.opt{display:block;width:100%;text-align:start;font-size:16px;line-height:1.6;padding:10px 14px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--fg);cursor:pointer}
.app[lang="ur"] .opt{line-height:2}
.opt:hover{border-color:var(--curb)}
.opt[data-s="ok"]{background:var(--ok-bg);border-color:var(--ok-fg);color:var(--ok-fg);font-weight:600}
.opt[data-s="no"]{background:var(--bad-bg);border-color:var(--bad-fg);color:var(--bad-fg)}
.opt[data-s="lock"]{cursor:default;opacity:.75}
.fb{margin:12px 0 0;max-width:720px;padding:10px 14px;border-radius:10px;background:var(--info-bg);color:var(--info-fg)}
.fb b{display:block;font-size:13px}
.qbtn{margin-top:14px;font-size:15px;line-height:1.6;min-height:42px;padding:6px 20px;border:1px solid var(--pri);border-radius:999px;background:var(--pri);color:#fff;cursor:pointer}
:root[data-theme="dark"] .qbtn{color:#0C1511}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .qbtn{color:#0C1511}}
.score{font-family:var(--fd);font-size:26px;line-height:1.5;margin:6px 0 4px;font-weight:600;color:var(--pri)}
@media (prefers-reduced-motion:no-preference){.cap{transition:background .2s}.bar i{transition:width .3s}}

/* ---- Parking module ---- */
/* Scene */
.scenewrap{border-radius:12px;overflow:hidden;border:1px solid var(--line);background:var(--asph)}
.pscene{display:block;width:100%;height:auto;cursor:pointer;font-family:"IBM Plex Sans Arabic","IBM Plex Sans","Noto Sans Ethiopic",system-ui,sans-serif}
.asph{fill:var(--asph)}
.strip{fill:var(--green-strip)}
.kerb{fill:none;stroke:var(--curb);stroke-width:1.2}
.paint{stroke:var(--paint);stroke-width:1.4;fill:none;stroke-linecap:square}
.cline{stroke:var(--paint);stroke-width:1.4;stroke-dasharray:7 6;fill:none;opacity:.9}
.arrow{fill:none;stroke:var(--paint);stroke-width:1.4;opacity:.45;stroke-linecap:round;stroke-linejoin:round}
.tbay{fill:var(--okline);opacity:.16}
.tbayP{fill:var(--paint);opacity:.55;font-size:16px;font-weight:600;text-anchor:middle;dominant-baseline:central}
.goal{fill:none;stroke:var(--okline);stroke-width:1;stroke-dasharray:3 3;opacity:.7}
.hl{stroke:var(--sig);stroke-width:2.6;fill:none;opacity:0;stroke-linecap:square}
.hl.on{opacity:1}
.hl.ok{opacity:1;stroke:var(--okline)}
.ptag circle{fill:var(--asph2);stroke:var(--paint);stroke-width:1;opacity:.85}
.ptag text{fill:var(--paint);font-size:8px;font-weight:600;text-anchor:middle;dominant-baseline:central}
.ptag.on circle{fill:var(--sig);stroke:var(--sig);opacity:1}
.ptag.on text{fill:#2A1A00}
#pk-trail{fill:none;stroke-width:1.6;stroke-linecap:round;stroke-dasharray:1.5 4.5;opacity:.85}
#pk-sight{stroke:var(--sig);stroke-width:1.4;stroke-dasharray:3 3;fill:none}
.pk{stroke:rgba(0,0,0,.18);stroke-width:.6}
.pkg{fill:#2E3A35;opacity:.75}
.tyre{fill:#151B18}
#pk-carb{fill:var(--car);stroke:rgba(0,0,0,.25);stroke-width:.6}
.glass{fill:var(--car-glass);opacity:.95}
.mir{fill:var(--car)}
#pk-mirR.on{fill:var(--sig)}
#pk-markc{fill:none;stroke:var(--bad);stroke-width:2.4}

/* Dashboard */
.pdash{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:12px 0}
.pill{display:flex;align-items:center;gap:10px;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--soft);min-width:0}
.pill .k{display:block;font-size:12px;font-weight:600;color:var(--muted);line-height:1.4}
.pill .v{display:block;font-size:15px;font-weight:600;line-height:1.5;color:var(--fg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.app[lang="ur"] .pill .k,.app[lang="ur"] .pill .v{line-height:2}
.pill.on{background:var(--sig-bg);border-color:var(--sig)}
.pill.on .v{color:var(--sig-fg)}
.gears{display:flex;gap:4px;direction:ltr}
.gears span{width:22px;height:24px;border-radius:6px;display:grid;place-items:center;font:600 13px/1 "IBM Plex Sans",system-ui,sans-serif;color:var(--muted);border:1px solid var(--line);background:var(--card)}
.gears span.on{background:var(--pri);color:var(--on-pri);border-color:var(--pri)}
.gears span.r.on{background:var(--sig);border-color:var(--sig);color:#2A1A00}
#pk-wheel{width:30px;height:30px;flex:none;color:var(--fg)}
.pv{min-width:0}
@media (max-width:560px){.pdash{grid-template-columns:1fr 1fr}.pdash .pill:first-child{grid-column:1 / -1}}

.ctl #pk-bPause.next{background:var(--sig);border-color:var(--sig);color:#2A1A00;font-weight:600}
#pk-modes{grid-template-columns:repeat(auto-fit,minmax(130px,1fr))}
.pkopts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 16px}
@media (max-width:600px){.pkopts{grid-template-columns:minmax(0,1fr)}}
#pk-sides,#pk-dirs{grid-template-columns:repeat(2,minmax(0,1fr))}
#pk-sides button,#pk-dirs button{display:flex;align-items:center;justify-content:center;gap:10px}
#pk-sides svg,#pk-dirs svg{width:30px;height:22px;flex:none}
.lane text{fill:var(--paint);font-size:8.5px;font-weight:600;text-anchor:middle;dominant-baseline:central;opacity:.5}
.lane path{fill:none;stroke:var(--paint);stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round;opacity:.45}
.lane.on text,.lane.on path{opacity:.95}
.chip.pc{border-color:var(--pri);color:var(--pri)}
.chip.s{border-color:var(--sig);color:var(--sig-fg);background:var(--sig-bg)}
.app[lang="ur"] .cap .tx{line-height:2.2}

</style>

l=Math.max(0,Math.min(C[C.length-1],l));
for(var i=1;i<C.length;i++){
if(l<=C[i]){var f=(l-C[i-1])/((C[i]-C[i-1])||1);return [P[i-1][0]+(P[i][0]-P[i-1][0])*f,P[i-1][1]+(P[i][1]-P[i-1][1])*f];}
}
return P[P.length-1];
}
function mk(tag,at){var el=document.createElementNS(NS,tag);for(var k in at)el.setAttribute(k,at[k]);return el;}

var pts,cum,LE,LR,total,midPt,conf,lConf,lFreeze,tF,pcPts,pcCum,pcTotal;
var car=$('car'),carb=$('carb'),sigL=$('sigL'),sigR=$('sigR'),pc=$('pc'),trail=$('trail'),mark=$('mark'),markc=$('markc'),signG=$('signG');
var cap=$('cap'),phEl=$('ph'),txEl=$('tx'),lampL=$('lampL'),lampR=$('lampR'),flowLis=$('flow').children;
var tv=0,last=0,fin=false,lastCap='',raf=0;

function placeLabels(){
var g=$('labs'),a=ENT_A[S.entry];
g.textContent='';
var ex=[[340,244],[246,44],[40,136],[136,336]];
ex.forEach(function(b,i){
var p=rotPt(b[0],b[1],a);
g.appendChild(mk('circle',{cx:p[0].toFixed(1),cy:p[1].toFixed(1),r:11,'class':'tag'}));
var t=mk('text',{x:p[0].toFixed(1),y:p[1].toFixed(1),'class':'tagt'});t.textContent=num(i+1);g.appendChild(t);
});
var ln=[[214,346,1],[198,346,2],[326,214,1],[214,54,1],[54,166,1],[166,326,1]];
ln.forEach(function(b){
var p=rotPt(b[0],b[1],a);
g.appendChild(mk('circle',{cx:p[0].toFixed(1),cy:p[1].toFixed(1),r:7,'class':b[2]===1?'l1f':'l2f'}));
var t=mk('text',{x:p[0].toFixed(1),y:p[1].toFixed(1),'class':'lt'});t.textContent=num(b[2]);g.appendChild(t);
});
$('rot').setAttribute('transform','rotate('+ENT_A[S.entry]+' 190 190)');
$('stopTxt').setAttribute('transform','rotate('+(-ENT_A[S.entry])+')');
}

function build(){
var e=EX[S.exit],lane=e.lane,rA=R[lane],rB=R[lane==1?2:1],off=OFF[lane],wrong=S.mode===1;
var th0=360-Math.acos(off/rA)/D;
pts=[[CX+off,385],ptP(rA,th0)];
var n=Math.max(8,Math.ceil((e.th-th0)/3));
for(var i=1;i<=n;i++){
var t=i/n,r=rA;
if(wrong){var s=Math.min(1,t/0.5);r=rA+(rB-rA)*s*s*(3-2*s);}
pts.push(ptP(r,th0+(e.th-th0)*t));
}
midPt=pts[1+Math.floor(n*0.45)];
pts.push(e.wp,e.end);
cum=mkCum(pts);
LE=cum[1];LR=cum[n+1];total=cum[cum.length-1];
var yC=CY+Math.sqrt(79*79-off*off);
conf=[CX+off,yC];lConf=385-yC;lFreeze=lConf-4;tF=lFreeze/SPD;
var distConf=(S.mode===2)?SPD*tF+8:SPD*TP;
var thC=360-Math.acos(off/79)/D;
var thS=thC-distConf/79/D;
var th1=EX[1].th,m=Math.ceil((th1-thS)/3);
pcPts=[];
for(var k=0;k<=m;k++){pcPts.push(ptP(79,thS+(th1-thS)*k/m));}
pcPts.push(EX[1].wp,EX[1].end);
pcCum=mkCum(pcPts);pcTotal=pcCum[pcCum.length-1];
trail.setAttribute('d','M'+pts.map(function(p){return p[0].toFixed(1)+' '+p[1].toFixed(1);}).join('L'));
var c=wrong?'var(--bad)':(lane==1?'var(--l1)':'var(--l2)');
trail.style.stroke=S.mode===2?'var(--bad)':c;
carb.style.fill=S.mode===2?'var(--bad)':c;
var mp=S.mode===2?conf:midPt;
markc.setAttribute('transform','translate('+mp[0].toFixed(1)+','+mp[1].toFixed(1)+')');
show(mark,false);
}
function ourL(t){
if(S.mode===2)return Math.min(SPD*t,lFreeze);
if(t<T1){var u=t/T1;return STOPL*(1-(1-u)*(1-u));}
var dt=t-T1-HOLD;
if(dt<0)return STOPL;
return STOPL+(dt<0.4?106.25*dt*dt:SPD*(dt-0.2));
}
function pcL(t){return SPD*(S.mode===2?Math.min(t,tF):t);}

function capText(key){
var c=T().cap,lane=EX[S.exit].lane,o={L:num(lane),E:num(S.exit),S:lane==1?T().sideR:T().sideL};
var a=c[key],txt=fmt(a[1],o);
if((key==='signal'||key==='exit')&&lane===2&&a[2])txt+=' '+a[2];
return [fmt(a[0],o),txt];
}
function setCap(kind,key){
var id=S.lang+'|'+S.exit+'|'+S.mode+'|'+key;
if(id===lastCap)return;
lastCap=id;
var c=capText(key);
phEl.textContent=c[0];txEl.textContent=c[1];cap.setAttribute('data-k',kind);
}

function render(t){
var l=ourL(t),mode=S.mode;
fin=(mode===2)?(t>=tF+0.5):(l>=total-0.01);
var p=posAt(pts,cum,l),a=posAt(pts,cum,l-4),b=posAt(pts,cum,l+4);
var ang=Math.atan2(b[1]-a[1],b[0]-a[0])/D;
car.setAttribute('transform','translate('+p[0].toFixed(1)+','+p[1].toFixed(1)+') rotate('+ang.toFixed(1)+')');
var pl=pcL(t);
if(pl<=pcTotal){
var q=posAt(pcPts,pcCum,pl),qa=posAt(pcPts,pcCum,pl-4),qb=posAt(pcPts,pcCum,pl+4);
var qang=Math.atan2(qb[1]-qa[1],qb[0]-qa[0])/D;
pc.setAttribute('transform','translate('+q[0].toFixed(1)+','+q[1].toFixed(1)+') rotate('+qang.toFixed(1)+')');
pc.setAttribute('opacity',String(Math.min(1,t/0.5)));
}else{pc.setAttribute('opacity','0');}
var bl=Math.floor(t*3.5)%2===0;
var leftOn,rightOn;
if(mode===2){leftOn=l>40&&!fin;rightOn=false;}
else{leftOn=t>=TP&&l<LE+30;rightOn=l>LR-45&&l<LR+55;}
show(sigL,leftOn&&bl);show(sigR,rightOn&&bl);
lampL.classList.toggle('on',leftOn&&bl);lampR.classList.toggle('on',rightOn&&bl);
var key,kind='a',idx=0,bad=-1;
if(mode===2){
if(fin){key='collide';kind='r';idx=1;bad=1;}
else if(l<lConf-45){key='approach';idx=0;}
else{key='enterBad';kind='r';idx=2;}
}else{
if(fin){key=(mode===1)?'doneBad':'done';kind='g';idx=5;}
else if(t<T1-0.5){key='approach';idx=0;}
else if(t<TP){key='stop';idx=1;}
else if(l<LE+30){key='enter';idx=2;}
else if(l<LR-45){key=(mode===1)?'ringBad':'ring';kind=(mode===1)?'r':'a';idx=3;if(mode===1)bad=3;}
else if(l<LR+10){key=(mode===1)?'ringBad':'signal';kind=(mode===1)?'r':'a';idx=4;if(mode===1)bad=3;}
else{key=(mode===1)?'ringBad':'exit';kind=(mode===1)?'r':'a';idx=4;if(mode===1)bad=3;}
}
setCap(kind,key);
for(var i=0;i<5;i++){
var st=i<idx?'done':(i===idx?'cur':'todo');
if(i===bad)st='bad';
if(flowLis[i].getAttribute('data-s')!==st)flowLis[i].setAttribute('data-s',st);
}
if(mode===1&&idx>=3)flowLis[3].setAttribute('data-s','bad');
show(mark,(mode===1&&l>LE+(LR-LE)*0.3)||(mode===2&&fin));
signG.setAttribute('opacity',(key==='stop'||key==='collide')?'1':'0.55');
}

function tick(now){
if(ROOT.hidden){last=now;raf=requestAnimationFrame(tick);return;}
if(!last)last=now;
var dt=Math.min(0.05,(now-last)/1000);last=now;
if(!S.paused&&!fin)tv+=dt*(S.slow?0.5:1);
render(tv);
raf=requestAnimationFrame(tick);
}
function restart(){
tv=0;fin=false;lastCap='';S.paused=false;
$('bPause').textContent=T().ctl.pause;
build();
if(reduce){tv=100;render(tv);}
else render(0);
}

function renderQuiz(){
var t=T(),U=t.qUI,Q=t.q,n=Q.length;

$('qcount').textContent=fmt(U.count,{i:num(QZ.i+1),n:num(n)});

show($('qfb'),answered);show($('qnext'),answered);

$('qfbh').textContent=QZ.sel===COR[QZ.i]?U.ok:U.no;
$('qfbt').textContent=q.e;
$('qnext').textContent=QZ.i<n-1?U.next:U.result;
}
}

$('bSlow').textContent=t.ctl.slow;
$('scene').setAttribute('aria-label',t.title);
placeLabels();
renderQuiz();
lastCap='';
}
function paint(){
Array.prototype.forEach.call($('entries').children,function(b){b.setAttribute('aria-pressed',String(+b.dataset.n===S.entry));});
Array.prototype.forEach.call($('exits').children,function(b){b.setAttribute('aria-pressed',String(+b.dataset.e===S.exit));});
Array.prototype.forEach.call($('modes').children,function(b){b.setAttribute('aria-pressed',String(+b.dataset.m===S.mode));});
}

$('entries').addEventListener('click',function(ev){var b=ev.target.closest('button');if(!b)return;S.entry=+b.dataset.n;paint();placeLabels();restart();});
$('exits').addEventListener('click',function(ev){var b=ev.target.closest('button');if(!b)return;S.exit=+b.dataset.e;paint();restart();});
$('modes').addEventListener('click',function(ev){var b=ev.target.closest('button');if(!b)return;S.mode=+b.dataset.m;paint();restart();});

var ROOT=$('mod-rb');
window.RB={I18N:I18N,

activate:function(){restart();},

q:{2:{o:['بایاں سائیڈ مرر','اگلا بمپر','پچھلا پہیہ'],e:'جب تیسری لکیر بائیں مرر کے برابر آئے تو موڑ شروع کریں۔'},
3:{o:['پورا دائیں گھمائیں','درمیان میں رکھیں','پورا بائیں گھمائیں'],e:'رکیں، پھر اسٹیئرنگ پورا بائیں گھما کر آہستہ ریورس کریں۔'},
4:{o:['اسٹیئرنگ بائیں ہی رکھیں','اسٹیئرنگ درمیان میں لا کر سیدھا ریورس کریں','آگے جا کر دوبارہ شروع کریں']}}}
};
var TC={};
function mergeArr(a,o){return o?a.map(function(x,i){return o[i]!=null?o[i]:x;}):a;}
var S={lang:'ar',mode:0,side:'R',dir:'in',paused:false,slow:false,step:false};
var QZ={i:0,score:0,sel:-1,done:false};
var $=function(id){return document.getElementById('pk-'+id);};
var ROOT=document.getElementById('mod-pk');
var NS='http://www.w3.org/2000/svg';
var reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
function T(){
  var b=I18N[S.lang];if(S.side!=='L')return b;
  var key=S.lang;if(TC[key])return TC[key];
  var L=LEFT[S.lang],t={};for(var k in b)t[k]=b[k];
  ['hint','chip1','chip2','steer'].forEach(function(k){if(L[k])t[k]=L[k];});
  t.steps=mergeArr(b.steps,L.steps);t.rules=mergeArr(b.rules,L.rules);t.errs=mergeArr(b.errs,L.errs);
  t.cap={};for(var c in b.cap)t.cap[c]=(L.cap&&L.cap[c])||b.cap[c];
  t.q=b.q.map(function(x,i){var o=L.q&&L.q[i];if(!o)return x;var y={};for(var m in x)y[m]=x[m];for(var n in o)y[n]=o[n];return y;});
  return (TC[key]=t);
}
function num(n){var d=DIGS[S.lang],s=String(n);return d?s.replace(/\d/g,function(c){return d[+c];}):s;}
function show(el,on){el.style.display=on?'':'none';}
function fmt(s,o){return s.replace(/\{(\w+)\}/g,function(m,k){return o[k];});}
function mk(tag,at){var el=document.createElementNS(NS,tag);for(var k in at)el.setAttribute(k,at[k]);return el;}

/* ---------- Vehicle model ---------- */
function corners(x,y,h){
  var hx=Math.cos(h),hy=-Math.sin(h),rx=Math.sin(h),ry=Math.cos(h);
  return [[-ROH,-HW],[FOH,-HW],[FOH,HW],[-ROH,HW]].map(function(p){return [x+p[0]*hx+p[1]*rx,y+p[0]*hy+p[1]*ry];});
}
function proj(P,ax){var mn=1e9,mx=-1e9;P.forEach(function(p){var v=p[0]*ax[0]+p[1]*ax[1];if(v<mn)mn=v;if(v>mx)mx=v;});return [mn,mx];}
function hitTest(C){
  for(var i=0;i<OBS.length;i++){
    var o=OBS[i],B=[[o.x0,o.y0],[o.x1,o.y0],[o.x1,o.y1],[o.x0,o.y1]];
    var axes=[[1,0],[0,1],[C[1][0]-C[0][0],C[1][1]-C[0][1]],[C[3][0]-C[0][0],C[3][1]-C[0][1]]],sep=false;
    for(var a=0;a<4;a++){var p1=proj(C,axes[a]),p2=proj(B,axes[a]);if(p1[1]<p2[0]||p2[1]<p1[0]){sep=true;break;}}
    if(!sep){
      for(var j=0;j<4;j++){var c=C[j];if(c[0]>=o.x0&&c[0]<=o.x1&&c[1]>=o.y0&&c[1]<=o.y1)return c;}
      var cx=(C[0][0]+C[2][0])/2,cy=(C[0][1]+C[2][1])/2,best=B[0],bd=1e9;
      B.forEach(function(b){var d=Math.hypot(b[0]-cx,b[1]-cy);if(d<bd){bd=d;best=b;}});
      return best;
    }
  }
  return null;
}

/* Precompute the whole run for a scenario as fixed-time samples */
function simulate(mode,far){
  var y0=mode===1?Y_CLOSE:(far?Y_FAR:Y_OK);
  var st={x:XSTART,y:y0,h:0,s:0,g:'D',k:mode===1?'keepBad':'keep',p:0,c:0};
  var out=[],hit=null;
  function rec(){out.push({x:st.x,y:st.y,h:st.h,s:st.s,g:st.g,k:st.k,p:st.p,c:st.c});}
  function hold(sec,fn){var n=Math.round(sec/DT);for(var i=1;i<=n;i++){if(fn)fn(i/n);rec();}}
  function check(){var c=hitTest(corners(st.x,st.y,st.h));if(c){hit=c;return true;}return false;}
  // 1-2. drive forward, keep left, count the lines
  while(st.x<X0){
    var rem=X0-st.x,v=Math.min(60,4+1.5*rem);
    st.x=Math.min(X0,st.x+v*DT);if(X0-st.x<0.04)st.x=X0;
    var m=st.x+MIR,c=0;LINES.forEach(function(l){if(m>=l-0.01)c++;});st.c=c;
    if(m>=XB-12.5){st.k='count';st.p=1;}
    rec();
  }
  // 3. stop, reverse gear, full right lock
  st.k='align';st.p=2;
  hold(0.9,function(f){if(f>0.4)st.g='R';});
  hold(1.0,function(f){st.s=DMAX*(0.5-0.5*Math.cos(Math.PI*f));});
  st.s=DMAX;st.k='arc';
  var cx=X0,cy=y0+RR,phi=0,end=mode===2?Math.PI*0.95:Math.PI/2;
  while(phi<end-1e-9){
    var remA=RR*(Math.PI/2-phi),va=mode===2?26:Math.min(26,5+1.0*Math.max(0,remA));
    phi=Math.min(end,phi+va*DT/RR);
    st.x=cx-RR*Math.sin(phi);st.y=cy-RR*Math.cos(phi);st.h=phi;
    if(mode===2&&phi>Math.PI/2+0.02){st.k='noCenter';st.p=3;}
    if(check())break;
    rec();
  }
  if(!hit&&mode!==2){
    // 4. centre the wheel, reverse straight
    st.k='center';st.p=3;st.h=Math.PI/2;
    hold(0.9,function(f){st.s=DMAX*(0.5+0.5*Math.cos(Math.PI*f));});
    st.s=0;st.k='straight';
    while(true){
      var r2=STOPY-st.y,vs=mode===3?22:Math.min(22,3+1.4*Math.max(0,r2));
      st.y+=vs*DT;
      if(mode!==3&&st.y>=STOPY){st.y=STOPY;rec();break;}
      if(mode!==3&&r2<7){st.k='stop';st.p=4;}
      if(mode===3&&st.y>STOPY){st.k='noStop';st.p=4;}
      if(check())break;
      rec();
      if(st.y>260)break;
    }
  }
  if(hit){st.k=mode===1?'hitSide':(mode===2?'hitTurn':'hitCurb');}
  else{st.k='done';st.g='P';}
  st.p=5;
  hold(0.4);
  return {s:out,hit:hit};
}

/* ---------- Static lot ---------- */
function drawLot(){
  var g=$('lot'),d='';
  for(var k=-5;k<=8;k++){var x=XB-12.5+k*BW;d+='M'+x+' '+YE+'V'+YB+'M'+x+' 75V20';}
  d+='M0 '+YB+'H360M0 20H360';
  g.appendChild(mk('path',{d:d,'class':'paint'}));
  var h=$('hls');
  LINES.forEach(function(x,i){h.appendChild(mk('path',{id:'pk-hlc'+i,'class':'hl',d:'M'+x+' '+YE+'V'+YB}));});
  h.appendChild(mk('path',{id:'pk-hlb','class':'hl',d:'M'+(XB-12.5)+' '+YE+'V'+YB+'M'+(XB+12.5)+' '+YE+'V'+YB}));
  var tg=$('tags');
  LINES.forEach(function(x,i){
    var gg=mk('g',{'class':'ptag',id:'pk-tag'+i});
    gg.appendChild(mk('circle',{cx:x,cy:YE-6,r:5}));
    var t=mk('text',{x:x,y:YE-6,'class':'upr'});t.textContent=String(i+1);gg.appendChild(t);
    tg.appendChild(gg);
  });
  var pg=$('parked'),n=0;
  function car(cx,yA,frontUp){
    var col=PCOL[(n++)%PCOL.length],gg=mk('g',{});
    gg.appendChild(mk('rect',{x:cx-9,y:yA,width:18,height:46,rx:3.2,fill:col,'class':'pk'}));
    var wy=frontUp?yA+11:yA+46-17;
    gg.appendChild(mk('rect',{x:cx-7.2,y:wy,width:14.4,height:6,rx:1.6,'class':'pkg'}));
    var ry=frontUp?yA+46-9:yA+5;
    gg.appendChild(mk('rect',{x:cx-6.6,y:ry,width:13.2,height:4,rx:1.4,'class':'pkg'}));
    pg.appendChild(gg);
  }
  BOT.forEach(function(k){car(XB+k*BW,YE+4,true);});
  TOP.forEach(function(k){car(XB+k*BW,25,false);});
}

/* ---------- Animation ---------- */
var RUN,tv=0,last=0,fin=false,lastCap='',lastIdx=-1;
var car=$('car'),fwL=$('fwL'),fwR=$('fwR'),mirR=$('mirR'),trail=$('trail'),sight=$('sight'),mark=$('mark');
var cap=$('cap'),phEl=$('ph'),txEl=$('tx'),flowLis=$('flow').children,gearEls=$('gears').children;

function build(){
  RUN=simulate(S.mode,S.side==='L');
  var pts=[],s=RUN.s;
  for(var i=0;i<s.length;i+=6)pts.push(s[i].x.toFixed(1)+' '+s[i].y.toFixed(1));
  var L=s[s.length-1];pts.push(L.x.toFixed(1)+' '+L.y.toFixed(1));
  trail.setAttribute('d','M'+pts.join('L'));
  trail.style.stroke=S.mode===0?'var(--trail)':'var(--bad)';
  if(RUN.hit)mark.setAttribute('transform','translate('+RUN.hit[0].toFixed(1)+','+RUN.hit[1].toFixed(1)+')');
  show(mark,false);
}
var BADSTEP={1:0,2:3,3:4};
var RED={keepBad:1,noCenter:1,noStop:1,hitSide:1,hitTurn:1,hitCurb:1};

function setCap(f){
  var id=S.lang+'|'+S.mode+'|'+f.k+'|'+(f.k==='count'?f.c:'');
  if(id===lastCap)return;lastCap=id;
  var a=T().cap[f.k];
  phEl.textContent=a[0];
  txEl.textContent=fmt(a[1],{N:num(f.c),T:num(3)});
  cap.setAttribute('data-k',f.k==='done'?'g':(RED[f.k]?'r':'a'));
}
function render(t){
  var s=RUN.s,i=Math.min(s.length-1,Math.floor(t/DT)),f=s[i];
  fin=i>=s.length-1;
  car.setAttribute('transform','translate('+f.x.toFixed(2)+','+f.y.toFixed(2)+') rotate('+(-f.h/D).toFixed(2)+')');
  var wa=f.s.toFixed(1);
  fwL.setAttribute('transform','translate(27,-8.7) rotate('+wa+')');
  fwR.setAttribute('transform','translate(27,8.7) rotate('+wa+')');
  // reference guides
  var counting=f.k==='count'||f.k==='align'||f.k==='keep'||f.k==='keepBad';
  for(var j=0;j<3;j++){
    $('tag'+j).classList.toggle('on',f.c>j&&(f.p<=2));
    $('hlc'+j).setAttribute('class','hl'+((j===2&&(f.k==='align'||(f.k==='count'&&f.c===3)))?' on':''));
  }
  var watchLine=f.k==='straight'||f.k==='stop'||f.k==='noStop';
  $('hlb').setAttribute('class','hl'+(watchLine?' on':(f.k==='done'?' ok':'')));
  mirR.classList.toggle('on',f.k==='count'||f.k==='align'||watchLine);
  if(f.k==='align'){
    var mx=f.x+MIR,my=f.y+HW+2.8;
    sight.setAttribute('d','M'+mx.toFixed(1)+' '+my.toFixed(1)+'V'+(YE+18));show(sight,true);
  }else show(sight,false);
  show(mark,fin&&!!RUN.hit);
  // dashboard
  Array.prototype.forEach.call(gearEls,function(el){el.classList.toggle('on',el.dataset.g===f.g);});
  $('pGear').classList.toggle('on',f.g==='R');
  $('wheelG').setAttribute('transform','rotate('+((S.side==='L'?-1:1)*f.s/DMAX*540).toFixed(1)+' 16 16)');
  var stt=T().steer;
  $('vSteer').textContent=f.s<0.3?stt.c:(f.s>DMAX-0.3?stt.r:stt.t);
  $('pSteer').classList.toggle('on',f.s>0.3);
  $('vLines').textContent=num(f.c)+' / '+num(3);
  $('pLines').classList.toggle('on',f.p===1||f.k==='align');
  setCap(f);
  // step strip
  var idx=f.p,bad=BADSTEP[S.mode];
  for(var q=0;q<5;q++){
    var stt2=q<idx?'done':(q===idx?'cur':'todo');
    if(S.mode&&q===bad&&(idx>=bad||(S.mode===1)))stt2=(idx>=bad)?'bad':stt2;
    if(flowLis[q].getAttribute('data-s')!==stt2)flowLis[q].setAttribute('data-s',stt2);
  }
  // step-by-step pause
  if(S.step&&!reduce&&idx!==lastIdx&&lastIdx>=0&&idx<5&&!fin){S.paused=true;updPause();}
  lastIdx=idx;
}
function updPause(){
  var b=$('bPause'),c=T().ctl;
  if(S.paused&&S.step&&!fin){b.textContent=c.next;b.classList.add('next');}
  else{b.textContent=S.paused?c.play:c.pause;b.classList.remove('next');}
}
function tick(now){
  if(ROOT.hidden){last=now;requestAnimationFrame(tick);return;}
  if(!last)last=now;
  var dt=Math.min(0.05,(now-last)/1000);last=now;
  if(!S.paused&&!fin){tv+=dt*(S.slow?0.45:1);render(tv);}
  requestAnimationFrame(tick);
}
function restart(){
  tv=0;fin=false;lastCap='';lastIdx=-1;S.paused=false;
  build();
  if(reduce){tv=1e4;}
  render(tv);updPause();
}

/* ---------- Quiz ---------- */
function renderQuiz(){
  var t=T(),U=t.qUI,Q=t.q,n=Q.length;
  $('qbar').style.width=(100*(QZ.done?n:QZ.i+(QZ.sel>=0?1:0))/n)+'%';
  show($('qbody'),!QZ.done);show($('qres'),QZ.done);
  $('qretry').textContent=U.retry;
  if(QZ.done){$('qscore').textContent=fmt(U.score,{s:num(QZ.score),n:num(n)});return;}
  var q=Q[QZ.i];
  $('qcount').textContent=fmt(U.count,{i:num(QZ.i+1),n:num(n)});
  $('qtext').textContent=q.q;
  var box=$('qopts');box.textContent='';
  q.o.forEach(function(txt,k){
    var b=document.createElement('button');b.className='opt';b.textContent=txt;b.setAttribute('data-k',k);
    if(QZ.sel>=0){
      if(k===COR[QZ.i])b.setAttribute('data-s','ok');
      else if(k===QZ.sel)b.setAttribute('data-s','no');
      else b.setAttribute('data-s','lock');
    }
    box.appendChild(b);
  });
  var answered=QZ.sel>=0;
  show($('qfb'),answered);show($('qnext'),answered);
  if(answered){
    $('qfbh').textContent=QZ.sel===COR[QZ.i]?U.ok:U.no;
    $('qfbt').textContent=q.e;
    $('qnext').textContent=QZ.i<n-1?U.next:U.result;
  }
}

/* ---------- Language ---------- */
function applyLang(){
  var t=T(),app=ROOT;
  Array.prototype.forEach.call(app.querySelectorAll('[data-i]'),function(el){el.textContent=t[el.getAttribute('data-i')];});
  Array.prototype.forEach.call($('modes').children,function(b){b.textContent=t.modes[+b.dataset.m];});
  Array.prototype.forEach.call($('sides').children,function(b,i){b.lastChild.textContent=t.sides[i];});
  Array.prototype.forEach.call($('dirs').children,function(b,i){b.lastChild.textContent=t.dirs[i];});
  $('laneIn').lastChild.textContent=t.lanes[0];$('laneOut').lastChild.textContent=t.lanes[1];
  Array.prototype.forEach.call(flowLis,function(li,i){li.children[0].textContent=num(i+1);li.children[1].textContent=t.steps[i];});
  var rl=$('rules');rl.textContent='';
  t.rules.forEach(function(s,i){var li=document.createElement('li'),n=document.createElement('span'),x=document.createElement('span');n.className='n';n.textContent=num(i+1);x.textContent=s;li.appendChild(n);li.appendChild(x);rl.appendChild(li);});
  var er=$('errs');er.textContent='';
  t.errs.forEach(function(s){var li=document.createElement('li');li.textContent=s;er.appendChild(li);});
  $('bReplay').textContent=t.ctl.replay;
  $('bSlow').textContent=t.ctl.slow;
  $('bStep').textContent=t.ctl.step;
  updPause();
  for(var j=0;j<3;j++)$('tag'+j).lastChild.textContent=num(j+1);
  $('scene').setAttribute('aria-label',t.title);
  renderQuiz();
  lastCap='';
}
function paint(){
  Array.prototype.forEach.call($('modes').children,function(b){b.setAttribute('aria-pressed',String(+b.dataset.m===S.mode));});
  Array.prototype.forEach.call($('sides').children,function(b){b.setAttribute('aria-pressed',String(b.dataset.side===S.side));});
  Array.prototype.forEach.call($('dirs').children,function(b){b.setAttribute('aria-pressed',String(b.dataset.dir===S.dir));});
}
/* Physical lot is fixed: inbound lane (south, heading east), return lane (north, heading west).
   The run is simulated with the bay on the driver's right while heading east, then mirrored into place. */
function applySide(){
  var fy=(S.dir==='in')===(S.side==='L'),fx=S.dir==='out';
  var sx=fx?-1:1,sy=fy?-1:1;
  $('world').setAttribute('transform',(fx||fy)?'matrix('+sx+' 0 0 '+sy+' '+(fx?360:0)+' '+(fy?220:0)+')':'');
  Array.prototype.forEach.call($('scene').querySelectorAll('.upr'),function(el){
    var x=parseFloat(el.getAttribute('x')),y=parseFloat(el.getAttribute('y'));
    if(fx||fy)el.setAttribute('transform','matrix('+sx+' 0 0 '+sy+' '+(fx?2*x:0)+' '+(fy?2*y:0)+')');else el.removeAttribute('transform');
  });
  $('laneIn').classList.toggle('on',S.dir==='in');$('laneOut').classList.toggle('on',S.dir==='out');
}
function setSide(v){
  if(v!=='L'&&v!=='R')return;S.side=v;
  try{localStorage.setItem('pk-side',v);}catch(e){}
  applySide();paint();applyLang();restart();
}
function setDir(v){
  if(v!=='in'&&v!=='out')return;S.dir=v;
  try{localStorage.setItem('pk-dir',v);}catch(e){}
  applySide();paint();restart();
}

$('modes').addEventListener('click',function(ev){var b=ev.target.closest('button');if(!b)return;S.mode=+b.dataset.m;paint();restart();});
$('dirs').addEventListener('click',function(ev){var b=ev.target.closest('button');if(b&&b.dataset.dir!==S.dir)setDir(b.dataset.dir);});
$('sides').addEventListener('click',function(ev){var b=ev.target.closest('button');if(b&&b.dataset.side!==S.side)setSide(b.dataset.side);});
$('scene').addEventListener('click',restart);
$('bReplay').addEventListener('click',restart);
$('bPause').addEventListener('click',function(){if(fin){restart();return;}S.paused=!S.paused;updPause();});
$('bSlow').addEventListener('click',function(){S.slow=!S.slow;this.setAttribute('aria-pressed',String(S.slow));});
$('bStep').addEventListener('click',function(){S.step=!S.step;this.setAttribute('aria-pressed',String(S.step));if(!S.step&&S.paused){S.paused=false;}updPause();});
$('qopts').addEventListener('click',function(ev){
  var b=ev.target.closest('button');if(!b||QZ.sel>=0)return;
  QZ.sel=+b.getAttribute('data-k');
  if(QZ.sel===COR[QZ.i])QZ.score++;
  renderQuiz();
});
$('qnext').addEventListener('click',function(){
  if(QZ.i<T().q.length-1){QZ.i++;QZ.sel=-1;}else{QZ.done=true;}
  renderQuiz();
});
$('qretry').addEventListener('click',function(){QZ.i=0;QZ.score=0;QZ.sel=-1;QZ.done=false;renderQuiz();});

drawLot();
try{var sv0=localStorage.getItem('pk-side');if(sv0==='L')S.side='L';var dv0=localStorage.getItem('pk-dir');if(dv0==='out')S.dir='out';}catch(e){}
applySide();
window.PK={I18N:I18N,simulate:simulate,S:S,seek:function(t){tv=t;render(tv);},
setLang:function(l){S.lang=l;applyLang();render(tv);},
activate:function(){restart();},
start:function(l){S.lang=l;build();applyLang();paint();if(reduce){tv=1e4;}render(tv);requestAnimationFrame(tick);}};
})();
</script>
<script>
(function(){
var SH={
ar:{brand:'منصة تدريب السائقين',bsub:'وحدات تفاعلية لمهارات القيادة',tabs:'وحدات التدريب',d:['الدخول والالتزام بالمسار والخروج','الرجوع إلى موقف عمودي خطوة بخطوة']},
en:{brand:'Driver Training Platform',bsub:'Interactive modules for driving skills',tabs:'Training modules',d:['Enter, hold your lane, exit','Back into a perpendicular bay, step by step']},
am:{brand:'የአሽከርካሪዎች ስልጠና መድረክ',bsub:'ለመንዳት ክህሎት በይነተገናኝ ክፍሎች',tabs:'የስልጠና ክፍሎች',d:['መግባት፣ በመስመር መቆየት፣ መውጣት','ወደ ቋሚ ቦታ ወደ ኋላ መግባት፣ ደረጃ በደረጃ']},
ur:{brand:'ڈرائیور ٹریننگ پلیٹ فارم',bsub:'ڈرائیونگ مہارتوں کے لیے انٹرایکٹو ماڈیولز',tabs:'تربیتی ماڈیولز',d:['داخل ہونا، لین میں رہنا، نکلنا','عمودی جگہ میں ریورس، قدم بہ قدم']}};
var MODS={rb:{api:window.RB,slug:'roundabout'},pk:{api:window.PK,slug:'parking'}};
var st={lang:'ar',mod:'rb'};
var app=document.getElementById('app');
function g(id){return document.getElementById(id);}
function paintShell(){
  var t=MODS[st.mod].api.I18N[st.lang],sh=SH[st.lang];
  app.setAttribute('lang',st.lang);app.setAttribute('dir',t.dir);app.setAttribute('data-mod',st.mod);
  document.documentElement.setAttribute('lang',st.lang);document.documentElement.setAttribute('dir',t.dir);
  g('brandName').textContent=sh.brand;g('brandSub').textContent=sh.bsub;
  g('hEyebrow').textContent=t.eyebrow;g('hTitle').textContent=t.title;g('hSub').textContent=t.sub;g('hBy').textContent=t.by;
  g('mods').setAttribute('aria-label',sh.tabs);
  Array.prototype.forEach.call(g('mods').children,function(b,i){
    var m=b.dataset.mod;
    b.querySelector('.mt').textContent=MODS[m].api.I18N[st.lang].title;
    b.querySelector('.md').textContent=sh.d[i];
    b.setAttribute('aria-selected',String(m===st.mod));b.tabIndex=m===st.mod?0:-1;
  });
  Array.prototype.forEach.call(g('langs').children,function(b){b.setAttribute('aria-pressed',String(b.dataset.lang===st.lang));});
  g('mod-rb').hidden=st.mod!=='rb';g('mod-pk').hidden=st.mod!=='pk';
  document.title=t.title+' | '+sh.brand;
}
function writeHash(){try{var h=MODS[st.mod].slug+'-'+st.lang;if(location.hash.slice(1)!==h)history.replaceState(null,'','#'+h);}catch(e){}}
function readHash(){
  var h=(location.hash||'').slice(1),p=h.split('-'),r={};
  if(SH[h]){r.lang=h;r.mod='rb';}
  else{for(var k in MODS)if(MODS[k].slug===p[0])r.mod=k;if(SH[p[1]])r.lang=p[1];}
  return r;
}
function setLang(l){
  if(!SH[l]||l===st.lang)return;st.lang=l;
  try{localStorage.setItem('rb-lang',l);}catch(e){}
  MODS.rb.api.setLang(l);MODS.pk.api.setLang(l);paintShell();writeHash();
}
function setMod(m,focus){
  if(!MODS[m]||m===st.mod)return;st.mod=m;paintShell();writeHash();MODS[m].api.activate();
  if(focus)g('mods').querySelector('[data-mod="'+m+'"]').focus();
}
g('langs').addEventListener('click',function(ev){var b=ev.target.closest('button');if(b)setLang(b.dataset.lang);});
g('mods').addEventListener('click',function(ev){var b=ev.target.closest('.mtab');if(b)setMod(b.dataset.mod);});
g('mods').addEventListener('keydown',function(ev){
  if(ev.key!=='ArrowLeft'&&ev.key!=='ArrowRight')return;
  ev.preventDefault();setMod(st.mod==='rb'?'pk':'rb',true);
});
window.addEventListener('hashchange',function(){var r=readHash();if(r.lang&&r.lang!==st.lang)setLang(r.lang);if(r.mod&&r.mod!==st.mod)setMod(r.mod);});
try{var sv=localStorage.getItem('rb-lang');if(SH[sv])st.lang=sv;}catch(e){}
var r0=readHash();if(r0.lang)st.lang=r0.lang;if(r0.mod)st.mod=r0.mod;
paintShell();
MODS.rb.api.start(st.lang);MODS.pk.api.start(st.lang);
writeHash();
})();
</script>
</body>
</html>
